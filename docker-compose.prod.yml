version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.simulir.local}
    environment:
      - NODE_ENV=production

  backend:
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/simulir.db}
    volumes:
      - backend_data:/app/data

  caddy:
    environment:
      - DOMAIN=${DOMAIN:-simulir.local}

volumes:
  backend_data:
